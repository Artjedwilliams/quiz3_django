
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Student Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        /* ==============================
           WELCOME PAGE STYLES
        ============================== */

        :root {
            --welcome-navy: #111827;
            --welcome-background: #f2f7ff;
            --welcome-white: #ffffff;
            --welcome-text: #1e293b;
            --welcome-muted: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--welcome-background);
            color: var(--welcome-text);
        }

        /* Full-page centering */
        .welcome-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Main welcome card */
        .welcome-card {
            width: 100%;
            max-width: 650px;
            background: var(--welcome-white);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .welcome-card-accent {
            width: 100%;
            height: 10px;
            background: var(--welcome-navy);
        }

        .welcome-card-content {
            padding: 56px 40px;
            text-align: center;
        }

        .welcome-title {
            margin: 0 0 18px;
            color: var(--welcome-navy);
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.04em;
        }

        .welcome-description {
            max-width: 460px;
            margin: 0 auto;
            color: var(--welcome-muted);
            font-size: 0.98rem;
            line-height: 1.8;
        }

        /* Centered button wrapper */
        .welcome-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 32px;
        }

        .welcome-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 13px 24px;
            border: 1px solid var(--welcome-navy);
            border-radius: 8px;
            background: var(--welcome-navy);
            color: var(--welcome-white);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: background 0.2s ease,
                        transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .welcome-button:hover {
            background: #263449;
            border-color: #263449;
            color: var(--welcome-white);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(17, 24, 39, 0.15);
        }

        .welcome-button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 4px;
        }

        .welcome-footer {
            margin-top: 32px;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .welcome-page {
                padding: 16px;
            }

            .welcome-card-content {
                padding: 40px 22px;
            }

            .welcome-button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-page">
        <section class="welcome-card" aria-labelledby="welcome-title">

            <div class="welcome-card-accent"></div>

            <div class="welcome-card-content">

                <h1 class="welcome-title" id="welcome-title">
                    Welcome to My Django Application!
                </h1>

                <p class="welcome-description">
                    A simple Django web application for viewing registered
                    students and their information in one convenient place.
                </p>

                <!-- Button -->
                <div class="welcome-actions">
                    <a href="{% url 'dashboard' %}" class="welcome-button">
                        View Student Dashboard
                        <span aria-hidden="true">&nbsp; →</span>
                    </a>
                </div>

                <p class="welcome-footer">
                    Student Dashboard &bull; Powered by Django
                </p>

            </div>
        </section>
    </main>

</body>
</html>
